<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>旅画 - 首页方案一</title>
  <link rel="stylesheet" href="interactions.css">
  <script src="interactions.js" defer></script>
  <style>
    :root{--paper:#fbf6ec;--ink:#3c201c;--red:#bd3c35;--sun:#e7bc62}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.hero{position:relative;min-height:100dvh;overflow:hidden;background:#080807}.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82}.cover{position:absolute;inset:0;background:linear-gradient(90deg,#080807d9 0%,#0808076b 47%,#08080717 100%)}.shell{position:relative;z-index:1;width:min(1220px,calc(100% - 64px));min-height:100dvh;margin:auto;display:flex;flex-direction:column}.brand{margin:0;padding:26px 0}.brand-logo img{filter:brightness(0) invert(1) sepia(.2) saturate(5)}.pitch{margin:auto 0;padding:36px 0 86px;max-width:690px;color:var(--paper)}.eyebrow{margin:0 0 20px;color:#f4cc77;font-size:14px;font-weight:800;letter-spacing:.18em}.pitch h1{margin:0;font-size:clamp(46px,7vw,94px);line-height:1.02;letter-spacing:.03em}.pitch h1 span{display:block;color:#f1d2bd}.pitch p{max-width:460px;margin:25px 0 0;color:#f9eee1;font-size:17px;line-height:1.8}.formula{display:flex;align-items:center;gap:16px;margin:37px 0 0;font-size:17px;font-weight:800}.formula b{color:#f4cc77;font-size:31px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}.action{padding:15px 23px;border:1px solid #f9eee1;background:#f9eee1;color:var(--ink);font-weight:800;letter-spacing:.08em;text-decoration:none}.action.secondary{background:transparent;color:#f9eee1}.scene-nav{position:absolute;right:max(32px,calc((100vw - 1220px)/2));bottom:36px;display:flex;gap:13px}.scene-nav a{color:#f9eee1;font-size:13px;text-decoration:none;border-bottom:1px solid #f4cc77;padding-bottom:6px}@media(max-width:700px){.shell{width:min(100% - 36px,600px)}.cover{background:linear-gradient(180deg,#08080772,#080807dc 72%)}.pitch{padding-bottom:100px}.pitch p{font-size:15px}.formula{font-size:15px}.scene-nav{right:18px;bottom:22px}}
  </style>
</head>
<body>
  <main class="hero">
    <video src="https://wuyoubucket.oss-cn-chengdu.aliyuncs.com/uploads/static-videos/home-intro.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="cover"></div>
    <div class="shell">
      <p class="brand">旅画</p>
      <section class="pitch">
        <p class="eyebrow">TRAVEL PORTRAIT STUDIO</p>
        <h1>让你走进<span>每一处风景</span></h1>
        <p>把人物和旅行地点放在一起，生成一张属于这段行程的纪念画面。</p>
        <div class="formula"><span>人物照片</span><b>＋</b><span>风景照片</span><b>＝</b><span>旅途美图</span></div>
        <div class="actions"><a class="action" href="hero.html">开始生成主角画面</a><a class="action secondary" href="footprint.html">制作旅行足迹</a></div>
      </section>
    </div>
    <nav class="scene-nav"><a href="hero.html">主角生成</a><a href="reframe.html">游客照</a><a href="footprint.html">足迹卡片</a></nav>
  </main>
</body>
</html>
