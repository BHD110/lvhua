<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅画 - 错位叙事</title><link rel="stylesheet" href="interactions.css"><link rel="stylesheet" href="button-surface.css"><script src="interactions.js" defer></script><script src="button-surface.js" defer></script>
<style>
:root{--p:#fbf6ec;--i:#3c201c;--r:#bd3c35;--peach:#edc8b8;--sun:#e7bc62}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.opening{position:relative;min-height:100dvh;overflow:hidden;background:#120c0a;color:var(--p)}.opening-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.68}.opening-shade{position:absolute;inset:0;background:linear-gradient(180deg,#3c201c42,#3c201ca8 88%,#fbf6ec 100%)}.opening-inner{position:relative;z-index:1;width:min(1220px,calc(100% - 64px));min-height:100dvh;margin:auto;display:flex;flex-direction:column}.brand{margin:0;padding:25px 0}.brand-logo img{filter:sepia(.4) saturate(2.2) hue-rotate(330deg) brightness(.95)}.opening-copy{display:grid;place-items:center;margin:auto;transform:translateY(-2vh)}.opening-copy img{display:block;width:min(39vw,460px);height:auto;filter:drop-shadow(0 4px 24px #3c201cb0)}.scroll-hint{display:grid;place-items:center;gap:9px;margin:0 auto 27px;color:var(--p);font-size:12px;letter-spacing:.15em}.scroll-hint i{display:block;width:1px;height:38px;background:linear-gradient(var(--sun),transparent);animation:guide 1.8s ease-in-out infinite}@keyframes guide{0%,100%{transform:scaleY(.55);transform-origin:top;opacity:.55}50%{transform:scaleY(1);transform-origin:top;opacity:1}}.wrap{width:min(1220px,calc(100% - 64px));margin:auto}.scene{min-height:100dvh;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:clamp(34px,7vw,120px);border-top:1px solid #d9baa0;padding:60px 0}.scene:nth-of-type(odd){grid-template-columns:.86fr 1.14fr}.scene:nth-of-type(odd) .copy{order:-1}.image{position:relative;margin:0;border-radius:22px;overflow:hidden;box-shadow:0 18px 42px rgba(60,32,28,.16),0 38px 76px rgba(60,32,28,.12)}.image::after{content:none}.image img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}.hero .image{aspect-ratio:4/3}.reframe .image{aspect-ratio:4/3}.footprint .image{aspect-ratio:3/4;max-width:490px}.copy{position:relative}.copy::before{content:"";display:block;width:63px;height:8px;background:var(--r);margin-bottom:25px;transform:skewX(-28deg)}h1{margin:0;font-size:clamp(36px,5vw,72px);line-height:1.09;letter-spacing:2px}h1 span{color:var(--r);display:block;margin-top:7px}.copy p{margin:24px 0 0;color:#82594f;font-size:16px;line-height:1.7;letter-spacing:1px}.generate{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:28px;padding:0 24px;background:var(--r);border:1px solid var(--r);color:var(--p);font-weight:800;letter-spacing:2px;text-decoration:none;transition:background .2s ease,color .2s ease,transform .2s ease}.generate:hover{background:transparent;color:var(--r)}.generate:focus-visible{outline:3px solid var(--sun);outline-offset:4px}.reframe{background:linear-gradient(90deg,transparent 0 8%,#f4dec7 8% 92%,transparent 92%)}.footprint{padding-bottom:110px}@media(max-width:720px){.opening-inner,.wrap{width:min(100% - 36px,620px)}.opening-copy img{width:min(46vw,310px)}.scene,.scene:nth-of-type(odd){grid-template-columns:1fr;gap:27px;padding:64px 0}.scene:nth-of-type(odd) .copy{order:initial}.image{box-shadow:0 13px 30px rgba(60,32,28,.15),0 27px 54px rgba(60,32,28,.1)!important}.footprint .image{max-width:100%}h1{font-size:42px}.copy p{font-size:14px}.generate{width:100%;margin-top:22px}.reframe{background:transparent}}
</style></head><body><section class="opening"><video class="opening-video" src="https://wuyoubucket.oss-cn-chengdu.aliyuncs.com/uploads/static-videos/home-intro.mp4" autoplay muted loop playsinline preload="auto" aria-label="旅画开场动画"></video><div class="opening-shade"></div><div class="opening-inner"><p class="brand">旅画</p><header class="opening-copy"><img src="https://wuyoubucket.oss-cn-chengdu.aliyuncs.com/uploads/static-images-webp/home-brush-title.png" alt="山水贵州，等你绘成旅画"></header><div class="scroll-hint" aria-hidden="true"><span>向下探索</span><i></i></div></div></section><main class="wrap">
<section class="scene hero"><figure class="image"><img src="https://wuyoubucket.oss-cn-chengdu.aliyuncs.com/uploads/static-images-webp/%E7%B4%A0%E6%9D%90/%E4%B8%BB%E8%A7%92%E5%9B%BE.webp" alt="主角图"></figure><div class="copy"><h1>来时是游客<span>走时是主角</span></h1><p>用一张画面，留下旅途最有光彩的自己。</p><a class="generate" href="hero.html">生成主角画面</a></div></section>
<section class="scene reframe"><figure class="image"><img src="https://wuyoubucket.oss-cn-chengdu.aliyuncs.com/uploads/static-images-webp/%E7%B4%A0%E6%9D%90/%E5%BA%9F%E7%89%87%E5%9B%BE.webp" alt="游客照转化图"></figure><div class="copy"><h1>每张照片<span>都有新可能</span></h1><p>让走过的街巷、遇见的风景，重新成为值得珍藏的画面。</p><a class="generate" href="reframe.html">生成组件画面</a></div></section>
<section class="scene footprint"><figure class="image"><img src="https://wuyoubucket.oss-cn-chengdu.aliyuncs.com/uploads/static-images-webp/%E7%B4%A0%E6%9D%90/%E8%B6%B3%E8%BF%B9%E5%9B%BE.webp" alt="旅行足迹图"></figure><div class="copy"><h1>把旅途<span>装进行囊</span></h1><p>看得见的轨迹，随时可以翻阅的回忆。</p><a class="generate" href="footprint.html">生成足迹卡片</a></div></section>
</main></body></html>
