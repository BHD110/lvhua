<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅画 - 错位叙事</title><link rel="stylesheet" href="interactions.css"><script src="interactions.js" defer></script>
<style>
:root{--p:#fbf6ec;--i:#3c201c;--r:#bd3c35;--peach:#edc8b8;--sun:#e7bc62}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.wrap{width:min(1220px,calc(100% - 64px));margin:auto}.brand{margin:0;padding:31px 0 18px;color:var(--r);font-size:34px;font-weight:900;letter-spacing:9px}.scene{min-height:100dvh;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:clamp(34px,7vw,120px);border-top:1px solid #d9baa0;padding:60px 0}.scene:nth-of-type(odd){grid-template-columns:.86fr 1.14fr}.scene:nth-of-type(odd) .copy{order:-1}.image{position:relative;margin:0;box-shadow:18px 22px 0 var(--peach)}.scene:nth-of-type(odd) .image{box-shadow:-18px 22px 0 var(--r)}.image::after{content:"";position:absolute;width:31%;aspect-ratio:1;background:var(--sun);right:-9%;top:-9%;z-index:-1;clip-path:polygon(50% 0,100% 100%,0 100%)}.image img{display:block;width:100%;height:100%;object-fit:cover}.hero .image{aspect-ratio:4/3}.reframe .image{aspect-ratio:4/3}.footprint .image{aspect-ratio:3/4;max-width:490px}.copy{position:relative}.copy::before{content:"";display:block;width:63px;height:8px;background:var(--r);margin-bottom:25px;transform:skewX(-28deg)}h1{margin:0;font-size:clamp(36px,5vw,72px);line-height:1.09;letter-spacing:2px}h1 span{color:var(--r);display:block;margin-top:7px}.copy p{margin:24px 0 0;color:#82594f;font-size:16px;line-height:1.7;letter-spacing:1px}.generate{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:28px;padding:0 24px;background:var(--r);border:1px solid var(--r);color:var(--p);font-weight:800;letter-spacing:2px;text-decoration:none;transition:background .2s ease,color .2s ease,transform .2s ease}.generate:hover{background:transparent;color:var(--r)}.generate:focus-visible{outline:3px solid var(--sun);outline-offset:4px}.reframe{background:linear-gradient(90deg,transparent 0 8%,#f4dec7 8% 92%,transparent 92%)}.footprint{padding-bottom:110px}@media(max-width:720px){.wrap{width:min(100% - 36px,620px)}.brand{font-size:27px;padding:25px 0 16px}.scene,.scene:nth-of-type(odd){grid-template-columns:1fr;gap:27px;padding:64px 0}.scene:nth-of-type(odd) .copy{order:initial}.image{box-shadow:12px 15px 0 var(--peach)!important}.footprint .image{max-width:100%}h1{font-size:42px}.copy p{font-size:14px}.generate{width:100%;margin-top:22px}.reframe{background:transparent}}
</style></head><body><main class="wrap"><p class="brand">旅画</p>
<section class="scene hero"><figure class="image"><img src="素材/主角图.jpg" alt="主角图"></figure><div class="copy"><h1>来时是游客<span>走时是主角</span></h1><p>用一张画面，留下旅途最有光彩的自己。</p><a class="generate" href="hero.html">生成主角画面</a></div></section>
<section class="scene reframe"><figure class="image"><img src="素材/废片图.png" alt="废片转化图"></figure><div class="copy"><h1>每张照片<span>都有新可能</span></h1><p>让走过的街巷、遇见的风景，重新成为值得珍藏的画面。</p><a class="generate" href="reframe.html">生成组件画面</a></div></section>
<section class="scene footprint"><figure class="image"><img src="素材/足迹图.jpg" alt="旅行足迹图"></figure><div class="copy"><h1>把旅途<span>装进行囊</span></h1><p>看得见的轨迹，随时可以翻阅的回忆。</p><a class="generate" href="footprint.html">生成足迹卡片</a></div></section>
</main></body></html>
