<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅画 - 主角生成</title><link rel="stylesheet" href="interactions.css"><script src="interactions.js" defer></script><style>
:root{--paper:#fbf6ec;--ink:#3c201c;--red:#bd3c35;--rose:#edc8b8;--sun:#e7bc62;--line:#d9baa0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.page{width:min(1180px,calc(100% - 48px));margin:auto}.brand{padding:28px 0 16px;color:var(--red);font-size:32px;font-weight:900;letter-spacing:.27em}.section{padding:38px 0 76px;border-top:1px solid var(--line)}.preview{margin:0;position:relative;cursor:zoom-in;box-shadow:20px 22px 0 var(--rose)}.preview img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.tap{position:absolute;right:18px;bottom:16px;padding:10px 15px;background:var(--red);color:var(--paper);font-size:13px;font-weight:800;letter-spacing:.08em}.headline{margin:55px 0 28px;font-size:clamp(30px,4vw,55px);line-height:1.1}.headline span{color:var(--red)}.source-grid{display:grid;grid-template-columns:1fr 74px 1fr;gap:34px;align-items:center}.source h2{margin:0 0 18px;font-size:17px;letter-spacing:.1em}.plus{display:grid;place-items:center;color:var(--red);font-size:62px;font-weight:300}.stack{height:260px;position:relative;margin:0 0 26px}.stack img{position:absolute;width:min(74%,270px);height:220px;object-fit:cover;background:var(--rose);border:8px solid var(--paper);box-shadow:10px 12px 0 var(--rose);cursor:zoom-in}.stack img:nth-child(1){left:0;top:15px;transform:rotate(-5deg)}.stack img:nth-child(2){left:17%;top:0;transform:rotate(4deg)}.stack img:nth-child(3){left:8%;top:29px;transform:rotate(-1deg)}.upload{width:100%;min-height:58px;border:2px solid var(--red);background:transparent;color:var(--red);font:700 16px inherit;letter-spacing:.08em;cursor:pointer}.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;margin:0 0 14px}.albums img{width:100%;height:100px;object-fit:cover;cursor:zoom-in;border:3px solid var(--paper);box-shadow:4px 5px 0 var(--rose)}.generate{display:block;width:min(460px,100%);margin:56px auto 0;padding:18px;border:0;background:var(--red);color:var(--paper);font:900 19px inherit;letter-spacing:.18em;cursor:pointer}.status{text-align:center;min-height:24px;margin:15px 0 0;color:#82594f}.lightbox{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:24px;background:rgba(60,32,28,.83)}.lightbox.open{display:grid}.lightbox img{max-width:min(94vw,1200px);max-height:88vh;box-shadow:0 22px 70px rgba(0,0,0,.35)}.close{position:fixed;top:20px;right:25px;border:0;background:var(--paper);color:var(--red);font-size:26px;width:42px;height:42px;cursor:pointer}@media(max-width:680px){.page{width:min(100% - 32px,560px)}.brand{font-size:27px;padding:23px 0 14px}.section{padding:28px 0 58px}.preview{box-shadow:12px 14px 0 var(--rose)}.headline{margin:41px 0 24px}.source-grid{grid-template-columns:1fr;gap:37px}.plus{height:30px;font-size:50px}.stack{height:220px}.stack img{height:188px}.tap{right:10px;bottom:10px;font-size:12px}.generate{margin-top:42px}}</style></head><body><main class="page"><header class="brand">旅画</header><section class="section"><figure class="preview zoom"><img src="素材/主角页面/预览图.jpg" alt="主角生成预览图"><figcaption class="tap">点击放大</figcaption></figure><h1 class="headline">拼出<span>你的主角画面</span></h1><div class="source-grid"><section class="source"><h2>人物照片</h2><div class="stack gallery" id="people"><img src="素材/主角页面/人物图1.jpg" alt="人物照片一"><img src="素材/主角页面/人物图2.jpg" alt="人物照片二"></div><div class="albums" id="peopleAlbum"></div><input id="peopleInput" type="file" accept="image/*" multiple hidden><button class="upload" data-input="peopleInput">上传人物照片</button></section><div class="plus" aria-hidden="true">+</div><section class="source"><h2>风景照片</h2><div class="stack gallery" id="places"><img src="素材/主角页面/风景图1.jpg" alt="风景照片一"><img src="素材/主角页面/风景图2.jpg" alt="风景照片二"><img src="素材/主角页面/风景图3.jpg" alt="风景照片三"></div><div class="albums" id="placeAlbum"></div><input id="placeInput" type="file" accept="image/*" multiple hidden><button class="upload" data-input="placeInput">上传风景照片</button></section></div><button class="generate" id="generate">生成主角画面</button><p class="status" id="status"></p></section></main><div class="lightbox" id="lightbox"><button class="close" aria-label="关闭预览">×</button><img alt="放大预览"></div><script>const box=document.querySelector('#lightbox'),boxImg=box.querySelector('img');function zoom(src){boxImg.src=src;box.classList.add('open')}document.querySelectorAll('.zoom img,.gallery img').forEach(img=>img.onclick=()=>zoom(img.src));box.onclick=e=>{if(e.target===box||e.target.classList.contains('close'))box.classList.remove('open')};document.querySelectorAll('.upload').forEach(btn=>btn.onclick=()=>document.getElementById(btn.dataset.input).click());function bind(inputId,albumId){document.getElementById(inputId).onchange=e=>{const album=document.getElementById(albumId);[...e.target.files].forEach(file=>{const img=document.createElement('img');img.src=URL.createObjectURL(file);img.alt='已上传图片';img.onclick=()=>zoom(img.src);album.append(img)})}}bind('peopleInput','peopleAlbum');bind('placeInput','placeAlbum');document.getElementById('generate').onclick=()=>{const s=document.getElementById('status');s.innerHTML=window.amicroLoading('正在组合你的旅途画面');setTimeout(()=>s.textContent='画面已准备好，可以继续调整照片',750)}</script></body></html>
