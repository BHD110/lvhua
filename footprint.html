<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅画 - 生成足迹</title><link rel="stylesheet" href="interactions.css"><script src="interactions.js" defer></script>
<style>
:root{--paper:#fbf6ec;--ink:#3c201c;--red:#bd3c35;--rose:#edc8b8;--sun:#e7bc62;--line:#dfc9b0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.page{width:min(1140px,calc(100% - 64px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:28px 0}.brand{margin:0;color:var(--red);font-size:31px;font-weight:900;letter-spacing:8px}.mark{width:58px;height:14px;border-top:3px solid var(--red);border-bottom:3px solid var(--sun);transform:skewX(-32deg)}.content{min-height:calc(100dvh - 85px);display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.7fr);gap:clamp(40px,8vw,130px);align-items:center;padding:24px 0 74px}.preview{position:relative;margin:0;box-shadow:-20px 23px 0 var(--rose)}.preview::before{content:"";position:absolute;z-index:-1;right:-11%;bottom:-8%;width:36%;aspect-ratio:1;background:var(--sun);clip-path:polygon(50% 0,100% 70%,50% 100%,0 70%)}.preview img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.side{position:relative}.side::before{content:"";display:block;width:62px;height:8px;margin-bottom:23px;background:var(--red);transform:skewX(-28deg)}h1{margin:0 0 42px;font-size:clamp(36px,5vw,68px);line-height:1.1;letter-spacing:3px}h1 span{display:block;color:var(--red)}.task{padding:23px 0;border-top:1px solid var(--line)}.task:last-child{border-bottom:1px solid var(--line)}.task h2{margin:0;font-size:22px}.task p{margin:8px 0 16px;color:#835e55;font-size:14px}.action{width:100%;padding:14px;border:0;background:var(--red);color:var(--paper);font:inherit;font-weight:800;letter-spacing:2px;cursor:pointer}.action.alt{background:var(--sun);color:var(--ink)}.file{display:none}dialog{width:min(610px,calc(100% - 32px));padding:0;border:0;background:var(--paper);color:var(--ink);box-shadow:0 24px 60px #3c201c40}dialog::backdrop{background:#3c201c88}.dialog-head{padding:25px 29px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:24px}.close{border:0;background:transparent;color:var(--ink);font-size:28px;cursor:pointer}.locations{padding:17px 29px 9px}.location{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0}.place{height:50px;padding:0 16px;border:1px solid var(--line);background:#fffaf1;display:flex;align-items:center;gap:12px;color:var(--ink);font:inherit}.pin{position:relative;width:15px;height:15px;border-radius:50% 50% 50% 0;background:var(--red);transform:rotate(-45deg);flex:0 0 auto}.pin::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--paper)}.plus{width:50px;height:50px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:28px;cursor:pointer}.add{margin:6px 29px 20px;padding:10px 0;border:0;border-bottom:2px solid var(--red);background:transparent;color:var(--red);font:inherit;font-weight:800;cursor:pointer}.dialog-foot{padding:18px 29px 28px;display:flex;justify-content:flex-end}.primary{padding:13px 31px;border:0;background:var(--red);color:var(--paper);font:inherit;font-weight:800;letter-spacing:2px;cursor:pointer}.file-name{display:block;margin-top:8px;color:var(--red);font-size:13px;font-weight:700}@media(max-width:720px){.page{width:min(100% - 36px,560px)}.top{padding:24px 0}.content{grid-template-columns:1fr;gap:45px;padding-top:15px}.preview{max-width:470px;box-shadow:-13px 16px 0 var(--rose)}.side{width:100%}h1{margin-bottom:30px}.task{padding:21px 0}.dialog-head,.locations{padding-left:18px;padding-right:18px}.add{margin-left:18px}.dialog-foot{padding:18px}}@media(max-width:380px){h1{font-size:35px}.page{width:calc(100% - 28px)}}
</style></head><body><main class="page"><header class="top"><p class="brand">旅画</p><span class="mark"></span></header><section class="content"><figure class="preview"><img src="素材/足迹图.jpg" alt="足迹预览"></figure><div class="side"><h1>生成<br><span>我的足迹</span></h1><div class="task"><h2>足迹上传</h2><p>添加想要记录的地点与照片</p><button class="action" id="open-locations">添加足迹</button></div><div class="task"><h2>人物上传</h2><p id="person-note">选择一张人物照片</p><label class="action alt" for="person-file">上传人物<input class="file" id="person-file" type="file" accept="image/*"></label></div></div></section></main><dialog id="location-dialog"><div class="dialog-head"><h2>选择定位</h2><button class="close" aria-label="关闭">×</button></div><div class="locations" id="locations"></div><button class="add" id="add-location">+ 添加定位</button><div class="dialog-foot"><button class="primary" id="confirm-locations">确定</button></div></dialog><script>const d=document.querySelector('#location-dialog'),rows=document.querySelector('#locations');function row(name=''){const e=document.createElement('div');e.className='location';e.innerHTML=`<input class="place location-name" type="text" value="${name}" placeholder="输入地点名称" aria-label="地点名称"><label class="plus" title="上传图片">+<input class="file" type="file" accept="image/*"></label>`;e.querySelector('input[type=file]').onchange=x=>{if(x.target.files[0])e.querySelector('.plus').textContent='✓'};rows.append(e);return e}window.addFootprintLocation=row;row();row();document.querySelector('#open-locations').onclick=()=>d.showModal();document.querySelector('.close').onclick=()=>d.close();document.querySelector('#add-location').onclick=()=>row();document.querySelector('#confirm-locations').onclick=()=>d.close();document.querySelector('#person-file').onchange=e=>{if(e.target.files[0])document.querySelector('#person-note').innerHTML=`已选择：<span class="file-name">${e.target.files[0].name}</span>`}</script></body></html>
