<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅画 - 游客照生成</title><link rel="stylesheet" href="interactions.css"><link rel="stylesheet" href="button-surface.css"><script src="interactions.js" defer></script><script src="button-surface.js" defer></script><style>
:root{--p:#fbf6ec;--i:#3c201c;--r:#bd3c35;--rose:#edc8b8;--sun:#e7bc62;--line:#d9baa0}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.page{width:min(1080px,calc(100% - 56px));margin:auto;padding:28px 0 82px}.brand{margin:0 0 34px;color:var(--r);font-size:31px;font-weight:900;letter-spacing:.25em}.tool{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(34px,7vw,90px);align-items:center}.preview{position:relative;margin:0;aspect-ratio:4/3;background:var(--rose);box-shadow:20px 23px 0 var(--rose)}.preview::before{content:"";position:absolute;z-index:-1;left:-10%;bottom:-11%;width:33%;aspect-ratio:1;background:var(--sun);clip-path:polygon(0 0,100% 45%,28% 100%)}.preview img{display:block;width:100%;height:100%;object-fit:cover}.copy h1{margin:0;font-size:clamp(37px,5vw,65px);line-height:1.1;letter-spacing:.05em}.copy h1 span{display:block;color:var(--r)}.copy p{margin:18px 0 34px;color:#82594f;line-height:1.7}.upload{padding:22px 0;border-top:2px solid var(--i);border-bottom:1px solid var(--line)}.upload strong{display:block;font-size:17px}.upload small{display:block;margin-top:7px;color:#82594f}.actions{display:flex;gap:12px;margin-top:18px}input{position:absolute;width:1px;height:1px;opacity:0}.pick,.generate{border:0;border-radius:0;font:900 16px "Microsoft YaHei",sans-serif;cursor:pointer}.pick{padding:14px 20px;background:var(--rose);color:var(--i)}.generate{width:100%;margin-top:28px;padding:19px;background:var(--r);color:var(--p);font-size:20px;letter-spacing:.17em;box-shadow:10px 12px 0 var(--sun)}.name,.result{min-height:21px;margin:13px 0 0;color:var(--r);font-size:13px}.result{text-align:center;font-weight:800}@media(max-width:700px){.page{width:min(100% - 36px,560px)}.tool{grid-template-columns:1fr;gap:46px}.brand{font-size:27px;margin-bottom:24px}.preview{box-shadow:12px 15px 0 var(--rose)}.copy h1{font-size:42px}.generate{box-shadow:8px 10px 0 var(--sun)}}
</style></head><body><main class="page"><p class="brand">旅画</p><section class="tool"><figure class="preview"><img id="preview" src="https://wuyoubucket.oss-cn-chengdu.aliyuncs.com/uploads/static-images-webp/%E7%B4%A0%E6%9D%90/%E5%BA%9F%E7%89%87%E5%9B%BE.webp" alt="游客照预览"></figure><div class="copy"><h1>让游客照<span>重新发光</span></h1><p>上传旅行照片，为这段旅途准备新的画面。</p><div class="upload"><strong>上传你的游客照</strong><small>支持 JPG、PNG、WebP 格式</small><div class="actions"><label class="pick" for="file">选择图片</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div><p class="name" id="name">当前预览：示例游客照</p></div><button class="generate" id="generate">生成旅画</button><p class="result" id="result" aria-live="polite"></p></div></section></main><script>const f=document.querySelector('#file'),p=document.querySelector('#preview'),n=document.querySelector('#name'),b=document.querySelector('#generate'),r=document.querySelector('#result'),displayName=name=>{try{return decodeURIComponent(name).replace(/\.[^.]+$/,'')}catch{return name.replace(/\.[^.]+$/,'')}};let u='';f.onchange=()=>{const[x]=f.files;if(!x)return;if(u)URL.revokeObjectURL(u);u=URL.createObjectURL(x);p.src=u;p.alt='已上传的游客照预览';n.textContent=`已选择：${displayName(x.name)}`;r.textContent=''};b.onclick=()=>{b.disabled=true;b.textContent='正在生成';r.innerHTML=window.amicroLoading('旅画正在整理这段旅途的色彩与记忆');setTimeout(()=>{b.disabled=false;b.textContent='再次生成';r.textContent='画面已准备完成'},1100)}</script></body></html>
